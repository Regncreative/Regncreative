<svg xmlns="http://www.w3.org/2000/svg" width="400" height="340" viewBox="0 0 400 340" role="img" aria-label="Wedge — File shelf for Windows. Park files on the edge of your screen while you work and drag them out when you need them. Tauri, Rust, React. Shipped.">
<style>
.s{font-family:'Segoe UI Variable Display','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Inter,Arial,sans-serif} .m{font-family:ui-monospace,'Cascadia Code',SFMono-Regular,Consolas,Menlo,monospace} .r{font-family:Georgia,'Times New Roman',serif}
@keyframes drift{0%,100%{transform:translateX(0)}50%{transform:translateX(30px)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.4)}}
.w1{animation:drift 7s ease-in-out infinite}.w2{animation:drift 7s ease-in-out -2.3s infinite}.w3{animation:drift 7s ease-in-out -4.6s infinite}
.live{animation:blink 2.4s ease-in-out infinite}
.beat{transform-box:fill-box;transform-origin:center;animation:beat 1.6s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs><clipPath id="clip"><rect width="384" height="324" rx="26"/></clipPath><radialGradient id="g" cx="1" cy="1" r=".95"><stop offset="0" stop-color="#8D97FF" stop-opacity=".24"/><stop offset="1" stop-color="#8D97FF" stop-opacity="0"/></radialGradient></defs>
<g transform="translate(8,8)">
<g clip-path="url(#clip)"><rect width="384" height="324" fill="#101318"/><rect width="384" height="324" fill="url(#g)"/></g>
<rect x="1" y="1" width="382" height="322" rx="25" fill="none" stroke="#23272E" stroke-width="2"/>

<g transform="translate(30,30) scale(0.66)"><defs><clipPath id="wt"><rect width="64" height="64" rx="15"/></clipPath>
<linearGradient id="wbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2B2C3A"/><stop offset="1" stop-color="#14151C"/></linearGradient></defs>
<g transform="scale(1.5)"><g clip-path="url(#wt)"><rect width="64" height="64" fill="url(#wbg)"/>
<rect x="23" y="12" width="51" height="11" rx="5.5" fill="#8D97FF"/><rect x="11" y="26.5" width="63" height="11" rx="5.5" fill="#FF7FAC"/><rect x="27" y="41" width="47" height="11" rx="5.5" fill="#F6BB45"/></g>
<rect x=".5" y=".5" width="63" height="63" rx="14.5" fill="none" stroke="#FFFFFF" stroke-opacity=".08"/></g></g>
<g transform="translate(273.3,38)"><rect x="0" y="0" width="80.69999999999999" height="26" rx="13" fill="#C5A572" stroke="#C5A572"/><text x="40.349999999999994" y="16.96" text-anchor="middle" class="m" font-size="11" font-weight="700" letter-spacing="1.5" fill="#0A0A0A">SHIPPED</text></g>
<text x="30" y="146" class="m" font-size="12" letter-spacing="2" fill="#C5A572">02 · FILE SHELF FOR WINDOWS</text>
<text x="29" y="186" class="s" font-size="34" font-weight="700" letter-spacing="-.7" fill="#F0F3F6">Wedge</text>
<text x="30" y="222" class="s" font-size="17" fill="#8B949E">A file shelf on the edge of</text><text x="30" y="246" class="s" font-size="17" fill="#8B949E">your screen. Drag files in and out.</text>
<rect x="30" y="274" width="60" height="28" rx="14" fill="#161A20" stroke="#2A2F37"/><text x="60" y="292.32" text-anchor="middle" class="m" font-size="12" font-weight="400" letter-spacing="0" fill="#C9D1D9">Tauri</text><rect x="98" y="274" width="52.8" height="28" rx="14" fill="#161A20" stroke="#2A2F37"/><text x="124.4" y="292.32" text-anchor="middle" class="m" font-size="12" font-weight="400" letter-spacing="0" fill="#C9D1D9">Rust</text><rect x="158.8" y="274" width="60" height="28" rx="14" fill="#161A20" stroke="#2A2F37"/><text x="188.8" y="292.32" text-anchor="middle" class="m" font-size="12" font-weight="400" letter-spacing="0" fill="#C9D1D9">React</text>
<path d="M338 294 L350 282 M341 282 H350 V291" stroke="#8B949E" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</g>
</svg>
