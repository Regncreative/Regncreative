<rect x="30" y="274" width="74.39999999999999" height="28" rx="14" fill="#161A20" stroke="#2A2F37"/><text x="67.19999999999999" y="292.32" text-anchor="middle" class="m" font-size="12" font-weight="400" letter-spacing="0" fill="#C9D1D9">Flutter</text><rect x="112.39999999999999" y="274" width="60" height="28" rx="14" fill="#161A20" stroke="#2A2F37"/><text x="142.39999999999998" y="292.32" text-anchor="middle" class="m" font-size="12" font-weight="400" letter-spacing="0" fill="#C9D1D9">C++20</text><rect x="180.39999999999998" y="274" width="60" height="28" rx="14" fill="#161A20" stroke="#2A2F37"/><text x="210.39999999999998" y="292.32" text-anchor="middle" class="m" font-size="12" font-weight="400" letter-spacing="0" fill="#C9D1D9">Win32</text>
