<svg xmlns="http://www.w3.org/2000/svg" width="400" height="340" viewBox="0 0 400 340" role="img" aria-label="Pulse — Windows observability. Read-only diagnostics for Windows: Event Log activity in plain language, live system health, hardware inventory and local reports. Flutter, C++20, Win32. Shipped.">
<style>
.s{font-family:'Segoe UI Variable Display','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Inter,Arial,sans-serif} .m{font-family:ui-monospace,'Cascadia Code',SFMono-Regular,Consolas,Menlo,monospace} .r{font-family:Georgia,'Times New Roman',serif}
@keyframes drift{0%,100%{transform:translateX(0)}50%{transform:translateX(30px)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.4)}}
.w1{animation:drift 7s ease-in-out infinite}.w2{animation:drift 7s ease-in-out -2.3s infinite}.w3{animation:drift 7s ease-in-out -4.6s infinite}
.live{animation:blink 2.4s ease-in-out infinite}
.beat{transform-box:fill-box;transform-origin:center;animation:beat 1.6s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs><clipPath id="clip"><rect width="384" height="324" rx="26"/></clipPath><radialGradient id="g" cx="1" cy="1" r=".95"><stop offset="0" stop-color="#C8F04A" stop-opacity=".24"/><stop offset="1" stop-color="#C8F04A" stop-opacity="0"/></radialGradient></defs>
<g transform="translate(8,8)">
<g clip-path="url(#clip)"><rect width="384" height="324" fill="#101318"/><rect width="384" height="324" fill="url(#g)"/></g>
<rect x="1" y="1" width="382" height="322" rx="25" fill="none" stroke="#23272E" stroke-width="2"/>

<g transform="translate(30,30) scale(0.66)"><rect width="96" height="96" rx="21" fill="#C8F04A"/>
