<rect x="1" y="1" width="382" height="262" rx="25" fill="none" stroke="#C5A572" stroke-width="2"/>

<text x="30" y="96" class="r" font-size="84" fill="#0A0A0A" opacity=".3">“</text>
<text x="32" y="148" class="s" font-size="29" font-weight="700" letter-spacing="-.6" fill="#0A0A0A">Design is specification,</text>
<text x="32" y="184" class="s" font-size="29" font-weight="700" letter-spacing="-.6" fill="#0A0A0A">not decoration.</text>
<text x="32" y="236" class="m" font-size="11.5" letter-spacing="2" fill="#0A0A0A" opacity=".7">LOCAL-FIRST · READ-ONLY BY DEFAULT</text>
</g>
</svg>
